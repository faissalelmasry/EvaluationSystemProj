<form [formGroup]="form" (ngSubmit)="onSubmit()">

  <div class="mb-3">
    <label class="form-label">
      Department Name
    </label>

    <input
      type="text"
      class="form-control"
      formControlName="name">

  </div>

  <div class="mb-3">

    <label class="form-label">
      Description
    </label>

    <textarea
      rows="3"
      class="form-control"
      formControlName="description">

    </textarea>

  </div>

  <button
    type="submit"
    class="btn btn-primary"
    [disabled]="loading()">

    {{ loading() ? 'Creating...' : 'Create Department' }}

  </button>

</form>
