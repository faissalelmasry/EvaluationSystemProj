<div class="auth-wrapper">
  <div class="auth-card">

    <div class="auth-brand">
      <div class="brand-icon">🔐</div>
      <h1 class="brand-name">EvalSystem</h1>
    </div>

    <h2 class="auth-title">Change Password</h2>
    <p class="auth-subtitle">Update your account password</p>

    <div *ngIf="errorMessage()" class="alert-error">
      <span class="alert-icon">⚠</span>
      {{ errorMessage() }}
    </div>

    <div *ngIf="successMessage()" class="alert-success">
      <span class="alert-icon">✓</span>
      {{ successMessage() }}
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>

      <div class="field-group">
        <label class="field-label">Current Password</label>
        <div class="input-with-icon">
          <input
            [type]="showCurrentPassword() ? 'text' : 'password'"
            class="field-input"
            [class.field-error]="form.controls.currentPassword.touched && form.controls.currentPassword.invalid"
            formControlName="currentPassword"
            placeholder="Enter current password"
            autocomplete="current-password"
          />
          <button type="button" class="eye-btn" (click)="toggleCurrentPassword()">
            {{ showCurrentPassword() ? '🙈' : '👁' }}
          </button>
        </div>
        <small *ngIf="form.controls.currentPassword.touched && form.controls.currentPassword.invalid" class="error-text">Current password is required</small>
      </div>

      <div class="field-group">
        <label class="field-label">New Password</label>
        <div class="input-with-icon">
          <input
            [type]="showNewPassword() ? 'text' : 'password'"
            class="field-input"
            [class.field-error]="form.controls.newPassword.touched && form.controls.newPassword.invalid"
            formControlName="newPassword"
            placeholder="Enter new password"
            autocomplete="new-password"
          />
          <button type="button" class="eye-btn" (click)="toggleNewPassword()">
            {{ showNewPassword() ? '🙈' : '👁' }}
          </button>
        </div>
        <small *ngIf="form.controls.newPassword.touched && form.controls.newPassword.invalid" class="error-text">Password must be at least 6 characters</small>
      </div>

      <div class="field-group">
        <label class="field-label">Confirm New Password</label>
        <div class="input-with-icon">
          <input
            [type]="showConfirmPassword() ? 'text' : 'password'"
            class="field-input"
            [class.field-error]="form.controls.confirmPassword.touched && form.controls.confirmPassword.invalid"
            formControlName="confirmPassword"
            placeholder="Confirm new password"
            autocomplete="new-password"
          />
          <button type="button" class="eye-btn" (click)="toggleConfirmPassword()">
            {{ showConfirmPassword() ? '🙈' : '👁' }}
          </button>
        </div>
        <small *ngIf="form.controls.confirmPassword.touched && form.controls.confirmPassword.invalid" class="error-text">Please confirm your new password</small>
      </div>

      <button type="submit" class="submit-btn" [disabled]="loading()">
        <span *ngIf="loading()" class="spinner"></span>
        <span>{{ loading() ? 'Changing...' : 'Change Password' }}</span>
      </button>

    </form>

    <p class="auth-footer">
      <a routerLink="/admin" class="auth-link">Back to Dashboard</a>
    </p>

  </div>
</div>
