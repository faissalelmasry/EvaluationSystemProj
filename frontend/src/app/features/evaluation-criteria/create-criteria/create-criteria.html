<div class="form-container">

  <div class="form-card">

    <h2>{{ isEditMode ? 'Update Criterion' : 'Create Criterion' }}</h2>

    @if (BackEndError()) {
      <div class="alert-danger">
        {{ BackEndError() }}
      </div>
    }

    <form [formGroup]="Form" (ngSubmit)="onSubmit()">

      <div class="form-group">
        <label class="form-label">Title</label>
        <input class="form-control" formControlName="title" placeholder="e.g., Communication Skills" />

        @if (f['title'].touched && f['title'].errors?.['required']) {
          <small class="text-danger">Title is required</small>
        }
      </div>

      <div class="form-group">
        <label class="form-label">Description</label>
        <textarea class="form-control" formControlName="description" rows="3" placeholder="Describe how this criterion should be evaluated..."></textarea>
      </div>

      <div class="form-group">
        <label class="form-label">Question Type</label>
        <select class="form-select" formControlName="questionType">
          <option [ngValue]="null">Select Question Type</option>
          @for (q of questionTypes; track q.id) {
            <option [ngValue]="q.id">
              {{ q.name }}
            </option>
          }
        </select>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Max Score</label>
          <input type="number" class="form-control" formControlName="maxScore" placeholder="e.g., 10" />
        </div>

        <div class="form-group">
          <label class="form-label">Weight</label>
          <input type="number" class="form-control" formControlName="weight" placeholder="e.g., 5" />
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Order No</label>
          <input type="number" class="form-control" formControlName="orderNo" placeholder="e.g., 1" />
        </div>

        <div class="form-group checkbox-group">
          <label class="checkbox-container">
            <input type="checkbox" formControlName="isRequired" />
            <span class="checkbox-box"></span>
            <span class="checkbox-label">Required Criterion</span>
          </label>
        </div>
      </div>

      <div class="form-actions">
        <button class="btn-submit" type="submit" [disabled]="Form.invalid || IsSubmitting()">
          @if (IsSubmitting()) {
            <span class="spinner"></span>
            <span>Saving...</span>
          } @else {
            {{ isEditMode ? 'Update Criterion' : 'Create Criterion' }}
          }
        </button>
      </div>

    </form>

  </div>

</div>
