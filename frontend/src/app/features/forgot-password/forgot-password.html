<div class="auth-wrapper">
  <div class="auth-card">

    <div class="auth-brand">
      <div class="brand-icon">🔑</div>
      <h1 class="brand-name">EvalSystem</h1>
    </div>

    <h2 class="auth-title">Forgot Password</h2>
    <p class="auth-subtitle">Enter your email address and we'll send you a reset link</p>

    <div *ngIf="errorMessage()" class="alert-error">
      <span class="alert-icon">⚠</span>
      {{ errorMessage() }}
    </div>

    <div *ngIf="successMessage()" class="alert-success">
      <span class="alert-icon">✓</span>
      {{ successMessage() }}
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>

      <div class="field-group">
        <label class="field-label">Email address</label>
        <input
          type="email"
          class="field-input"
          [class.field-error]="form.controls.email.touched && form.controls.email.invalid"
          formControlName="email"
          placeholder="you@example.com"
          autocomplete="email"
        />
        <small *ngIf="form.controls.email.touched && form.controls.email.invalid" class="error-text">Please enter a valid email address</small>
      </div>

      <button type="submit" class="submit-btn" [disabled]="loading()">
        <span *ngIf="loading()" class="spinner"></span>
        <span>{{ loading() ? 'Sending...' : 'Send Reset Link' }}</span>
      </button>

    </form>

    <p class="auth-footer">
      Remember your password?
      <a routerLink="/login" class="auth-link">Back to login</a>
    </p>

  </div>
</div>
