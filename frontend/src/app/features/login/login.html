<div class="auth-wrapper">
  <div class="auth-card">

    <div class="auth-brand">
      <div class="brand-icon">⚡</div>
      <h1 class="brand-name">EvalSystem</h1>
    </div>

    <h2 class="auth-title">Welcome back</h2>
    <p class="auth-subtitle">Sign in to your account to continue</p>

    <div *ngIf="errorMessage()" class="alert-error">
      <span class="alert-icon">⚠</span>
      {{ errorMessage() }}
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>

      <div class="field-group">
        <label class="field-label">Email address</label>
        <input
          type="email"
          class="field-input"
          [class.field-error]="form.controls.email.touched && form.controls.email.invalid"
          formControlName="email"
          placeholder="you@example.com"
          autocomplete="email"
        />
        <small *ngIf="form.controls.email.touched && form.controls.email.invalid" class="error-text">Please enter a valid email address</small>
      </div>

      <div class="field-group">
        <div class="label-row">
          <label class="field-label">Password</label>
          <a routerLink="/forgot-password" class="forgot-link">Forgot password?</a>
        </div>
        <div class="input-with-icon">
          <input
            [type]="showPassword() ? 'text' : 'password'"
            class="field-input"
            [class.field-error]="form.controls.password.touched && form.controls.password.invalid"
            formControlName="password"
            placeholder="Enter your password"
            autocomplete="current-password"
          />
          <button type="button" class="eye-btn" (click)="togglePassword()">
            {{ showPassword() ? '🙈' : '👁' }}
          </button>
        </div>
        <small *ngIf="form.controls.password.touched && form.controls.password.invalid" class="error-text">Password is required</small>
      </div>

      <button type="submit" class="submit-btn" [disabled]="loading()">
        <span *ngIf="loading()" class="spinner"></span>
        <span>{{ loading() ? 'Signing in...' : 'Sign In' }}</span>
      </button>

    </form>

    <p class="auth-footer">
      Don't have an account?
      <a routerLink="/register" class="auth-link">Create one here</a>
    </p>

  </div>
</div>
