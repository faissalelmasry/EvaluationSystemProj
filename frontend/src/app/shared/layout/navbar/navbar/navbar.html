<div class="top-bar">
  <div class="top-bar-left">
    <h2 class="page-title">{{ pageTitle }}</h2>
  </div>

  <div class="top-bar-right">
    <div class="user-section">
      <div class="user-info">
        <div class="user-name">{{ userName }}</div>
        <div class="user-role">{{ userRole }}</div>
      </div>

      <div class="profile-container">
        <button class="avatar" (click)="toggleProfileMenu()">{{ userInitials }}</button>

        <div class="profile-dropdown" *ngIf="showProfileMenu">
          <div class="dropdown-header">
            <div class="profile-info">
              <div class="avatar-large">{{ userInitials }}</div>
              <div>
                <p class="name">{{ userName }}</p>
                <p class="email">{{ userEmail }}</p>
              </div>
            </div>
          </div>

          <div class="dropdown-divider"></div>

          <div class="dropdown-menu">
            <button class="menu-item" (click)="openProfile()">
              <span class="icon">👤</span>
              <span class="text">My Profile</span>
            </button>
            <button class="menu-item" (click)="openChangePassword()">
              <span class="icon">🔐</span>
              <span class="text">Change Password</span>
            </button>
          </div>

          <div class="dropdown-divider"></div>

          <div class="dropdown-footer">
            <button class="logout-btn" (click)="logout()">
              <span class="icon">🚪</span>
              <span class="text">Logout</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="dropdown-overlay" *ngIf="showProfileMenu" (click)="closeDropdown()"></div>
</div>
